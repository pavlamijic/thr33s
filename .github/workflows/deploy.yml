name: Deploy to DotNS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 1

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    # Publish via polkadot-app-deploy (`pad`), the successor to bulletin-deploy
    # (https://docs.polkadotcommunity.foundation/guides/build-and-publish/).
    #
    # `--env devnet` targets the Products Devnet (Paseo Asset Hub 1000 /
    # Bulletin 1010); the name resolves at playthrees33.dev-dot.li. `--js-merkle`
    # does content-addressing in pure JS so no IPFS Kubo binary is needed.
    #
    # `--config polkadot-app-deploy.config.ts` publishes the on-chain product
    # manifest (root manifest on playthrees33.dot + the executable record on
    # app.playthrees33.dot with appVersion), which is what makes Hosts launch +
    # version the app. The build is downloaded into ./dist so it matches the
    # config's executable `path`; we checkout the repo so the config + icon.png
    # are present.
    #
    # `--publish` lists playthrees33.dot in the on-chain Publisher registry (host
    # directory). The `MNEMONIC` account registers the name on first deploy, so
    # it needs PAS on Paseo Asset Hub (faucet.polkadot.io, parachain 1000).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install polkadot-app-deploy
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@latest

      - name: Deploy to DotNS (devnet)
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: pad --js-merkle --env devnet --publish --config polkadot-app-deploy.config.ts dist playthrees33.dot
