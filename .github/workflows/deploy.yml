name: Deploy to DotNS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN_NAME: thr33s

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Compute build hash
        id: hash
        run: echo "hash=$(find dist -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deployment cache
        id: cache
        if: inputs.skip-cache != true
        uses: actions/cache@v4
        with:
          path: .deploy-cache
          key: deploy-${{ steps.hash.outputs.hash }}

      - name: Load cached CID
        id: cached-deploy
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cid=$(cat .deploy-cache/cid)" >> "$GITHUB_OUTPUT"
          echo "::notice::Found cached CID: $(cat .deploy-cache/cid)"

      - name: Setup IPFS Kubo
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ipfs/download-ipfs-distribution-action@v1
        with:
          name: kubo
          version: v0.33.0

      - name: Initialize IPFS
        if: steps.cache.outputs.cache-hit != 'true'
        run: ipfs init

      - name: Create deployment scripts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p deploy-scripts

          cat > deploy-scripts/package.json << 'EOF'
          {
            "name": "deploy-scripts",
            "version": "1.0.0",
            "type": "module",
            "dependencies": {
              "@ipld/dag-pb": "^4.1.3",
              "@noble/hashes": "^1.7.2",
              "@polkadot-api/substrate-bindings": "^0.16.5",
              "@polkadot-labs/hdkd": "^0.0.25",
              "@polkadot-labs/hdkd-helpers": "^0.0.26",
              "@polkadot/keyring": "^13.0.0",
              "@polkadot/util-crypto": "^13.0.0",
              "ipfs-unixfs": "^11.2.0",
              "multiformats": "^13.4.1",
              "polkadot-api": "^1.23.1",
              "viem": "^2.30.5"
            }
          }
          EOF

          cat > deploy-scripts/deploy.js << 'DEPLOY_EOF'
          import { Buffer } from "buffer";
          import * as fs from "fs";
          import * as path from "path";
          import { execSync } from "child_process";
          import { sha256 } from "@noble/hashes/sha256";
          import { blake2b } from "@noble/hashes/blake2b";
          import { sr25519CreateDerive } from "@polkadot-labs/hdkd";
          import { DEV_PHRASE, entropyToMiniSecret, mnemonicToEntropy } from "@polkadot-labs/hdkd-helpers";
          import { createClient as createPolkadotClient } from "polkadot-api";
          import { Binary } from "@polkadot-api/substrate-bindings";
          import { getPolkadotSigner } from "polkadot-api/signer";
          import { getWsProvider } from "polkadot-api/ws-provider";
          import { withPolkadotSdkCompat } from "polkadot-api/polkadot-sdk-compat";
          import { CID } from "multiformats/cid";
          import { create as createMultihash } from "multiformats/hashes/digest";
          import { base32 } from "multiformats/bases/base32";
          import { base58btc } from "multiformats/bases/base58";
          import * as dagPB from "@ipld/dag-pb";
          import { UnixFS } from "ipfs-unixfs";
          import crypto from "crypto";
          import { createClient } from "polkadot-api";
          import { Keyring } from "@polkadot/keyring";
          import { cryptoWaitReady } from "@polkadot/util-crypto";
          import {
            encodeFunctionData,
            decodeFunctionResult,
            keccak256,
            toBytes,
            formatEther,
            isAddress,
            bytesToHex,
            isHex,
            toHex,
            zeroAddress,
            namehash,
            concatHex,
          } from "viem";

          const BULLETIN_RPC = process.env.BULLETIN_RPC || "wss://bulletin.dotspark.app";
          const CHUNK_SIZE = 1.5 * 1024 * 1024;
          const MAX_FILE_SIZE = 8 * 1024 * 1024;
          const CID_CONFIG = { version: 1, codec: 0x55, hashCode: 0x12, hashLength: 32 };

          const RPC_ENDPOINTS = [
            "wss://asset-hub-paseo-rpc.n.dwellir.com",
            "wss://sys.ibp.network/asset-hub-paseo",
          ];

          const CONTRACTS = {
            DOTNS_REGISTRAR: "0x329aAA5b6bEa94E750b2dacBa74Bf41291E6c2BD",
            DOTNS_REGISTRAR_CONTROLLER: "0xd09e0F1c1E6CE8Cf40df929ef4FC778629573651",
            DOTNS_REGISTRY: "0x4Da0d37aBe96C06ab19963F31ca2DC0412057a6f",
            DOTNS_RESOLVER: "0x95645C7fD0fF38790647FE13F87Eb11c1DCc8514",
            DOTNS_CONTENT_RESOLVER: "0x7756DF72CBc7f062e7403cD59e45fBc78bed1cD7",
            STORE_FACTORY: "0x030296782F4d3046B080BcB017f01837561D9702",
            DOTNS_RULES: "0x4e8920B1E69d0cEA9b23CBFC87A17Ee6fE02d2d3",
          };

          const DECIMALS = 12n;
          const NATIVE_TO_ETH_RATIO = 1_000_000n;
          const DOT_NODE = "0x3fce7d1364a893e213bc4212792b517ffc88f5b13b86c8ef9c8d390c3a1370ce";

          function createCID(data, codec = CID_CONFIG.codec, hashCode = CID_CONFIG.hashCode) {
            let hash = hashCode === 0x12 ? sha256(data) : blake2b(data, { dkLen: 32 });
            return CID.createV1(codec, createMultihash(hashCode, hash));
          }

          function encodeContenthash(cidString) {
            const decoder = cidString.startsWith("Qm") ? base58btc : base32;
            const cid = CID.parse(cidString, decoder);
            const contenthash = new Uint8Array(cid.bytes.length + 2);
            contenthash[0] = 0xe3;
            contenthash[1] = 0x01;
            contenthash.set(cid.bytes, 2);
            return Buffer.from(contenthash).toString("hex");
          }

          function toHashingEnum(mhCode) {
            if (mhCode === 0x12) return { type: "Sha2_256", value: undefined };
            if (mhCode === 0xb220) return { type: "Blake2b256", value: undefined };
            throw new Error(`Unhandled multihash code: ${mhCode}`);
          }

          function createSigner(mnemonic) {
            const entropy = mnemonicToEntropy(mnemonic);
            const miniSecret = entropyToMiniSecret(entropy);
            const derive = sr25519CreateDerive(miniSecret);
            const keyPair = derive("");
            return getPolkadotSigner(keyPair.publicKey, "Sr25519", keyPair.sign);
          }

          function chunk(data, size = CHUNK_SIZE) {
            const chunks = [];
            let offset = 0;
            while (offset < data.length) {
              chunks.push(new Uint8Array(data.subarray(offset, Math.min(offset + size, data.length))));
              offset += size;
            }
            return chunks;
          }

          async function merkleize(directoryPath, outputCarPath) {
            console.log(`   Merkleizing: ${directoryPath}`);
            const cid = execSync(`ipfs add -Q -r --cid-version=1 --raw-leaves --pin=false "${directoryPath}"`, { encoding: "utf-8" }).trim();
            execSync(`ipfs dag export ${cid} > "${outputCarPath}"`);
            const size = fs.statSync(outputCarPath).size;
            console.log(`   CAR: ${(size / 1024 / 1024).toFixed(2)} MB`);
            return { carPath: outputCarPath, cid };
          }

          async function storeToBlockchain(carBuffer, mnemonic) {
            console.log(`\n   Connecting to Bulletin: ${BULLETIN_RPC}`);
            const client = createPolkadotClient(withPolkadotSdkCompat(getWsProvider(BULLETIN_RPC)));
            const unsafeApi = client.getUnsafeApi();
            const signer = createSigner(mnemonic);

            const carChunks = chunk(carBuffer);
            console.log(`   Chunks: ${carChunks.length}`);

            const stored = [];
            for (let i = 0; i < carChunks.length; i++) {
              const chunkBytes = carChunks[i];
              console.log(`   [${i + 1}/${carChunks.length}] ${(chunkBytes.length / 1024 / 1024).toFixed(2)} MB`);
              const cid = createCID(chunkBytes, CID_CONFIG.codec, 0x12);
              const tx = unsafeApi.tx.TransactionStorage.store({ data: Binary.fromBytes(chunkBytes) });
              const txOpts = { customSignedExtensions: { ProvideCidConfig: { value: { codec: BigInt(CID_CONFIG.codec), hashing: toHashingEnum(0x12) } } } };
              await new Promise((resolve, reject) => {
                const sub = tx.signSubmitAndWatch(signer, txOpts).subscribe({
                  next: (event) => { if (event.type === "finalized") { console.log(`      CID: ${cid.toString()}`); sub.unsubscribe(); resolve(); } },
                  error: (e) => { sub.unsubscribe(); reject(e); },
                });
              });
              stored.push({ cid, len: chunkBytes.length });
            }

            console.log(`\n   Building DAG-PB root...`);
            const fileData = new UnixFS({ type: "file", blockSizes: stored.map((c) => BigInt(c.len)) });
            const dagNode = dagPB.prepare({ Data: fileData.marshal(), Links: stored.map((c) => ({ Name: "", Tsize: c.len, Hash: c.cid })) });
            const dagBytes = dagPB.encode(dagNode);
            const rootCid = createCID(dagBytes, 0x70, 0x12);

            const rootTx = unsafeApi.tx.TransactionStorage.store({ data: Binary.fromBytes(dagBytes) });
            const rootTxOpts = { customSignedExtensions: { ProvideCidConfig: { value: { codec: BigInt(0x70), hashing: toHashingEnum(0x12) } } } };
            await new Promise((resolve, reject) => {
              const sub = rootTx.signSubmitAndWatch(signer, rootTxOpts).subscribe({
                next: (event) => { if (event.type === "finalized") { sub.unsubscribe(); resolve(); } },
                error: (e) => { sub.unsubscribe(); reject(e); },
              });
            });

            client.destroy();
            return rootCid.toString();
          }

          // DotNS functions
          function convertWeiToNative(weiValue) { return weiValue / NATIVE_TO_ETH_RATIO; }
          function computeDomainTokenId(label) {
            const labelhash = keccak256(toBytes(label));
            return BigInt(keccak256(concatHex([DOT_NODE, labelhash])));
          }
          function validateDomainLabel(label) {
            if (!/^[a-z0-9-]{3,}$/.test(label)) throw new Error("Invalid domain label");
            if (label.startsWith("-") || label.endsWith("-")) throw new Error("Cannot start/end with hyphen");
          }

          const DOTNS_REGISTRAR_CONTROLLER_ABI = [
            { inputs: [{ name: "registration", type: "tuple", components: [{ name: "label", type: "string" }, { name: "owner", type: "address" }, { name: "secret", type: "bytes32" }, { name: "reserved", type: "bool" }] }], name: "makeCommitment", outputs: [{ name: "", type: "bytes32" }], stateMutability: "view", type: "function" },
            { inputs: [{ name: "commitment", type: "bytes32" }], name: "commit", outputs: [], stateMutability: "nonpayable", type: "function" },
            { inputs: [], name: "minCommitmentAge", outputs: [{ name: "", type: "uint256" }], stateMutability: "view", type: "function" },
            { inputs: [{ name: "registration", type: "tuple", components: [{ name: "label", type: "string" }, { name: "owner", type: "address" }, { name: "secret", type: "bytes32" }, { name: "reserved", type: "bool" }] }], name: "register", outputs: [], stateMutability: "payable", type: "function" },
          ];

          const DOTNS_REGISTRAR_ABI = [
            { inputs: [{ name: "tokenId", type: "uint256" }], name: "ownerOf", outputs: [{ name: "", type: "address" }], stateMutability: "view", type: "function" },
          ];

          const DOTNS_CONTENT_RESOLVER_ABI = [
            { inputs: [{ name: "node", type: "bytes32" }, { name: "hash", type: "bytes" }], name: "setContenthash", outputs: [], stateMutability: "nonpayable", type: "function" },
          ];

          const DOTNS_RULES_ABI = [
            { inputs: [{ name: "name", type: "string" }], name: "price", outputs: [{ name: "", type: "uint256" }], stateMutability: "view", type: "function" },
            { inputs: [{ name: "", type: "address" }], name: "userPopStatus", outputs: [{ name: "", type: "uint8" }], stateMutability: "view", type: "function" },
            { inputs: [{ name: "status", type: "uint8" }], name: "setUserPopStatus", outputs: [], stateMutability: "nonpayable", type: "function" },
          ];

          class DotNS {
            constructor() { this.client = null; this.clientWrapper = null; this.substrateAddress = null; this.evmAddress = null; this.signer = null; }

            async connect(mnemonic) {
              const rpc = RPC_ENDPOINTS[0];
              console.log(`   Connecting to: ${rpc}`);
              this.client = createClient(getWsProvider(rpc));
              this.unsafeApi = this.client.getUnsafeApi();

              // Wait for client to sync with chain
              console.log(`   Waiting for chain sync...`);
              await new Promise(r => setTimeout(r, 5000));

              await cryptoWaitReady();
              const keyring = new Keyring({ type: "sr25519" });
              const account = keyring.addFromMnemonic(mnemonic);
              this.substrateAddress = account.address;
              this.evmAddress = (await this.unsafeApi.apis.ReviveApi.address(this.substrateAddress)).asHex();
              this.signer = getPolkadotSigner(account.publicKey, "Sr25519", async (input) => account.sign(input));
              console.log(`   SS58: ${this.substrateAddress}`);
              console.log(`   H160: ${this.evmAddress}`);
            }

            async contractCall(contractAddress, abi, functionName, args = []) {
              const data = encodeFunctionData({ abi, functionName, args });
              const result = await this.unsafeApi.apis.ReviveApi.call(
                this.substrateAddress,
                Binary.fromHex(contractAddress),
                0n,
                { ref_time: 18446744073709551615n, proof_size: 18446744073709551615n },
                18446744073709551615n,
                Binary.fromHex(data)
              );
              const returnData = result.result.value?.data?.asHex?.() || "0x";
              return decodeFunctionResult({ abi, functionName, data: returnData });
            }

            async contractTransaction(contractAddress, value, abi, functionName, args = []) {
              const data = encodeFunctionData({ abi, functionName, args });

              // Dry run first
              const dryRun = await this.unsafeApi.apis.ReviveApi.call(
                this.substrateAddress,
                Binary.fromHex(contractAddress),
                value,
                { ref_time: 18446744073709551615n, proof_size: 18446744073709551615n },
                18446744073709551615n,
                Binary.fromHex(data)
              );

              const gasRequired = dryRun.weight_required || dryRun.weight_consumed;
              const storageDeposit = 2_000_000_000_000n;

              // Ensure account mapped
              try {
                const mappingTx = this.unsafeApi.tx.Revive.map_account();
                await new Promise((resolve, reject) => {
                  const sub = mappingTx.signSubmitAndWatch(this.signer).subscribe({
                    next: (e) => { if (e.type === "finalized") { sub.unsubscribe(); resolve(); } },
                    error: (e) => {
                      sub.unsubscribe();
                      if (e.message?.includes("AccountAlreadyMapped")) resolve();
                      else reject(e);
                    },
                  });
                });
              } catch (e) {
                if (!e.message?.includes("AccountAlreadyMapped")) throw e;
              }

              const tx = this.unsafeApi.tx.Revive.call({
                dest: Binary.fromHex(contractAddress),
                value,
                weight_limit: { ref_time: gasRequired.ref_time || gasRequired.refTime, proof_size: gasRequired.proof_size || gasRequired.proofSize },
                storage_deposit_limit: storageDeposit,
                data: Binary.fromHex(data),
              });

              return new Promise((resolve, reject) => {
                const sub = tx.signSubmitAndWatch(this.signer).subscribe({
                  next: (event) => {
                    if (event.type === "finalized") {
                      if (event.dispatchError) reject(new Error(`Transaction failed`));
                      else { sub.unsubscribe(); resolve(event.txHash?.toString()); }
                    }
                  },
                  error: (e) => { sub.unsubscribe(); reject(e); },
                });
              });
            }

            async checkOwnership(label) {
              const tokenId = computeDomainTokenId(label);
              try {
                const owner = await this.contractCall(CONTRACTS.DOTNS_REGISTRAR, DOTNS_REGISTRAR_ABI, "ownerOf", [tokenId]);
                return { owned: owner.toLowerCase() === this.evmAddress.toLowerCase(), owner };
              } catch { return { owned: false, owner: null }; }
            }

            async register(label) {
              validateDomainLabel(label);

              // Set PoP status to none (0)
              console.log(`   Setting PoP status...`);
              try {
                await this.contractTransaction(CONTRACTS.DOTNS_RULES, 0n, DOTNS_RULES_ABI, "setUserPopStatus", [0]);
              } catch (e) { console.log(`   PoP status already set or error: ${e.message}`); }

              // Generate commitment
              console.log(`   Generating commitment...`);
              const secret = `0x${crypto.randomBytes(32).toString("hex")}`;
              const registration = { label, owner: this.evmAddress, secret, reserved: false };
              const commitment = await this.contractCall(CONTRACTS.DOTNS_REGISTRAR_CONTROLLER, DOTNS_REGISTRAR_CONTROLLER_ABI, "makeCommitment", [registration]);

              // Submit commitment
              console.log(`   Submitting commitment...`);
              await this.contractTransaction(CONTRACTS.DOTNS_REGISTRAR_CONTROLLER, 0n, DOTNS_REGISTRAR_CONTROLLER_ABI, "commit", [commitment]);

              // Wait for commitment age
              const minAge = await this.contractCall(CONTRACTS.DOTNS_REGISTRAR_CONTROLLER, DOTNS_REGISTRAR_CONTROLLER_ABI, "minCommitmentAge", []);
              const waitSecs = Number(minAge) + 10;
              console.log(`   Waiting ${waitSecs}s for commitment to mature...`);
              await new Promise(r => setTimeout(r, waitSecs * 1000));

              // Reconnect to get fresh block info (prevents AncientBirthBlock error)
              console.log(`   Refreshing connection...`);
              this.client.destroy();
              this.client = createClient(getWsProvider(RPC_ENDPOINTS[0]));
              this.unsafeApi = this.client.getUnsafeApi();
              await new Promise(r => setTimeout(r, 3000));

              // Get price and register
              const price = await this.contractCall(CONTRACTS.DOTNS_RULES, DOTNS_RULES_ABI, "price", [label]);
              const paymentWei = (price * 110n) / 100n;
              const paymentNative = convertWeiToNative(paymentWei);
              console.log(`   Registering ${label}.dot for ${formatEther(paymentWei)} PAS...`);
              await this.contractTransaction(CONTRACTS.DOTNS_REGISTRAR_CONTROLLER, paymentNative, DOTNS_REGISTRAR_CONTROLLER_ABI, "register", [registration]);
              console.log(`   Registered!`);
            }

            async setContenthash(label, contenthashHex) {
              const node = namehash(`${label}.dot`);
              console.log(`   Setting contenthash for ${label}.dot...`);
              await this.contractTransaction(CONTRACTS.DOTNS_CONTENT_RESOLVER, 0n, DOTNS_CONTENT_RESOLVER_ABI, "setContenthash", [node, contenthashHex]);
              console.log(`   Contenthash set!`);
            }

            disconnect() { if (this.client) this.client.destroy(); }
          }

          // Main deploy function - uses IPFS CID directly (no Bulletin storage)
          export async function deploy(buildDir, domainName, mnemonic) {
            console.log("\n" + "=".repeat(60));
            console.log("DEPLOYING TO POLKADOT");
            console.log("=".repeat(60));
            console.log(`   Domain: ${domainName}.dot`);
            console.log(`   Build dir: ${path.resolve(buildDir)}`);

            // Merkleize to get IPFS CID
            console.log("\n" + "=".repeat(60));
            console.log("IPFS");
            console.log("=".repeat(60));
            const carPath = path.join(path.dirname(buildDir), "build.car");
            const { cid: ipfsCid } = await merkleize(buildDir, carPath);
            console.log(`   IPFS CID: ${ipfsCid}`);

            // DotNS - register domain and set contenthash
            console.log("\n" + "=".repeat(60));
            console.log("DotNS");
            console.log("=".repeat(60));
            const dotns = new DotNS();
            await dotns.connect(mnemonic);

            const { owned } = await dotns.checkOwnership(domainName);
            if (!owned) {
              console.log(`   Registering ${domainName}.dot...`);
              await dotns.register(domainName);
            } else {
              console.log(`   Domain already owned`);
            }

            const contenthash = `0x${encodeContenthash(ipfsCid)}`;
            await dotns.setContenthash(domainName, contenthash);
            dotns.disconnect();

            console.log("\n" + "=".repeat(60));
            console.log("DEPLOYMENT COMPLETE!");
            console.log("=".repeat(60));
            console.log(`\n   Main: https://${domainName}.paseo.li`);
            console.log(`   Alt:  https://${domainName}.bigtava.online\n`);

            return { cid: ipfsCid, ipfsCid, domain: domainName };
          }
          DEPLOY_EOF

      - name: Install deployment dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: deploy-scripts
        run: npm install

      - name: Debug secret
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: |
          if [ -z "$MNEMONIC" ]; then
            echo "::warning::MNEMONIC secret is NOT set or is empty!"
            echo "Using default dev mnemonic"
          else
            echo "MNEMONIC is set (length: ${#MNEMONIC} chars, words: $(echo $MNEMONIC | wc -w))"
          fi

      - name: Deploy to DotNS
        id: deploy
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          node --max-old-space-size=4096 --input-type=module -e "
          import { deploy } from './deploy-scripts/deploy.js';

          const mnemonic = process.env.MNEMONIC;
          if (!mnemonic) {
            console.error('ERROR: MNEMONIC secret is not set');
            process.exit(1);
          }
          console.log('Mnemonic word count:', mnemonic.split(' ').length);
          const result = await deploy('dist', '${{ env.DOMAIN_NAME }}', mnemonic);

          const fs = await import('fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, \`cid=\${result.cid}\n\`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, \`domain=\${result.domain}\n\`);
          "

      - name: Save deployment to cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .deploy-cache
          echo "${{ steps.deploy.outputs.cid }}" > .deploy-cache/cid

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| -------- | ----- |" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | \`${{ env.DOMAIN_NAME }}.dot\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CID | \`${{ steps.deploy.outputs.cid || steps.cached-deploy.outputs.cid }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Main:** [https://${{ env.DOMAIN_NAME }}.paseo.li](https://${{ env.DOMAIN_NAME }}.paseo.li)" >> $GITHUB_STEP_SUMMARY
          echo "- **Alternative:** [https://${{ env.DOMAIN_NAME }}.bigtava.online](https://${{ env.DOMAIN_NAME }}.bigtava.online)" >> $GITHUB_STEP_SUMMARY
