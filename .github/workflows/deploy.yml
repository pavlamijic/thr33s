name: Deploy to DotNS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Target network. paseo-next-v2 (-> playthrees33.paseo.li) until the devnet
# Bulletin storage authorization is sorted, then switch to devnet
# (-> playthrees33.dev-dot.li). The contract address per network lives in
# src/web3/config.ts.
env:
  NETWORK: paseo-next-v2

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        env:
          VITE_NETWORK: ${{ env.NETWORK }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 1

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    # Publish via polkadot-app-deploy (`pad`), the successor to bulletin-deploy
    # (https://docs.polkadotcommunity.foundation/guides/build-and-publish/).
    #
    # `--env $NETWORK` picks the environment: devnet (Paseo Asset Hub 1000 /
    # Bulletin 1010, playthrees33.dot at dev-dot.li) or paseo-next-v2 (Asset Hub
    # Next 1500, playthrees33.paseo at paseo.li). `--js-merkle`
    # does content-addressing in pure JS so no IPFS Kubo binary is needed.
    #
    # `--config polkadot-app-deploy.config.ts` publishes the on-chain product
    # manifest (root manifest on the name + the executable record on its app.
    # subname with appVersion), which is what makes Hosts launch +
    # version the app. The build is downloaded into ./dist so it matches the
    # config's executable `path`; we checkout the repo so the config + icon.png
    # are present.
    #
    # `--publish` lists the name in the on-chain Publisher registry (host
    # directory). The `MNEMONIC` account registers the name on first deploy, so
    # it needs PAS on that network's Asset Hub (faucet.polkadot.io) and a
    # storage authorization on that network's Bulletin chain.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install polkadot-app-deploy
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@latest

      - name: Deploy to DotNS (${{ env.NETWORK }})
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
          PAD_ENV: ${{ env.NETWORK }}
        run: pad --js-merkle --env "$NETWORK" --publish --config polkadot-app-deploy.config.ts dist playthrees33
