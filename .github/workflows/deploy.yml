name: Deploy to DotNS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    outputs:
      dotns-domain: ${{ steps.domain.outputs.dotns-domain }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set domain name
        id: domain
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            DOMAIN="thr33s.dot"
          else
            BRANCH="${{ github.event.pull_request.head.ref }}"
            SAFE_BRANCH=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-//;s/-$//')
            DOMAIN="thr33s-${SAFE_BRANCH}00.dot"
          fi
          echo "dotns-domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute source hash
        id: source-hash
        run: echo "hash=$(find src public index.html package.json vite.config.ts -type f 2>/dev/null | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache build
        id: cache-build
        uses: actions/cache@v4
        with:
          path: dist
          key: build-${{ steps.source-hash.outputs.hash }}

      - name: Build app
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 1

  deploy:
    needs: build
    name: Deploy
    uses: paritytech/product-infrastructure/.github/workflows/deploy-frontend.yml@main
    with:
      dotns-domain: ${{ needs.build.outputs.dotns-domain }}
      artifact-name: frontend-build
      skip-cache: ${{ inputs.skip-cache || false }}
    secrets:
      mnemonic: ${{ secrets.MNEMONIC }}
