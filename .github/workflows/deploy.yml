name: Deploy to DotNS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 1

  deploy:
    needs: build
    name: Deploy
    # Canonical maintained workflow — replaces the previous 968-line inline,
    # whose endpoint defaults and Bulletin/IPFS pipeline drifted out of date.
    # paritytech/product-infrastructure's deploy-to-triangle.yml is deprecated
    # and points here. @main tracks fixes; pin to a sha if reproducibility matters.
    uses: paritytech/dotns-sdk/.github/workflows/deploy.yml@main
    with:
      basename: playthrees33
      mode: production
      artifact-name: frontend-build
      skip-cache: ${{ inputs.skip-cache || false }}
    secrets:
      dotns-mnemonic: ${{ secrets.MNEMONIC }}
