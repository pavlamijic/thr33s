name: Deploy to DotNS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 1

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest
    # Publish via the public `bulletin-deploy` npm CLI — the current canonical
    # app-publish path, matching the festival baseline (paritytech/festival).
    #
    # Why the CLI and not paritytech/bulletin-deploy's reusable workflow:
    # this repo (pavlamijic/thr33s) lives outside the paritytech org, and
    # bulletin-deploy is a *private* repo — a `uses:` reference to its
    # reusable workflow is not accessible from here. The npm package is
    # public, so we run it directly and get the same deploy.
    #
    # `--env paseo-next-v2` puts the name on the chain the live gateways read
    # (after the paseo-v2 -> paseo-next-v2 migration); `--js-merkle` does
    # content-addressing in pure JS so no IPFS Kubo binary is needed.
    #
    # `--config bulletin-deploy.config.ts` is what makes Hosts actually launch +
    # version the app: it publishes the on-chain product manifest (root manifest
    # on playthrees33.dot + the executable record on app.playthrees33.dot with
    # appVersion). Without it we'd only set a legacy contenthash, which the host
    # doesn't version/refresh cleanly. The build is downloaded into ./dist so it
    # matches the config's executable `path` (reuses the uploaded CID). We
    # checkout the repo so the config + icon.png are present. (No `--publish`:
    # that's the optional Publisher *registry* listing, which needs PoP and is
    # separate from launching the app.)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bulletin-deploy
        run: npm install -g bulletin-deploy

      - name: Deploy to DotNS (paseo-next-v2)
        env:
          MNEMONIC: ${{ secrets.MNEMONIC }}
        run: bulletin-deploy --js-merkle --env paseo-next-v2 --config bulletin-deploy.config.ts dist playthrees33.dot
